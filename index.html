<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Rumaaaa</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* LOVEY THEME BACKGROUND */
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            background-color: #ffdde1; 
            background-image: linear-gradient(0deg, #ffdde1 0%, #ee9ca7 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Nunito', sans-serif;
            overflow: hidden; /* Prevents scrollbars when button runs away */
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 90%;
            width: 400px;
            position: relative;
        }

        /* IMAGE STYLING */
        .gif-container img {
            width: 100%;
            max-width: 250px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        /* TEXT STYLING */
        h1 {
            font-family: 'Fredoka One', cursive;
            color: #ff4d4d;
            margin-bottom: 10px;
            font-size: 28px;
        }

        p {
            color: #555;
            font-size: 18px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* BUTTON STYLING */
        .btn-box {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            font-family: 'Nunito', sans-serif;
        }

        .yes-btn {
            background-color: #4CAF50; /* Green */
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .yes-btn:hover {
            transform: scale(1.05);
            background-color: #45a049;
        }

        .no-btn {
            background-color: #f44336; /* Red */
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: relative; 
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="gif-container">
        <img id="mainImage" src="https://media1.tenor.com/m/BbSkyx3DaEgAAAAd/goma-sad.gif" alt="Goma Sad" />
       </div> 

        <h1 id="headerText">I'm sorry :( </h1>
        <p id="bodyText">I really messed up today <br> Can you please forgive me?</p>

        <div class="btn-box">
            <button class="yes-btn" onclick="acceptApology()">Yes, I forgive you</button>
            <button class="no-btn" id="noBtn" onmouseover="moveButton()" onclick="moveButton()">No</button>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const mainImage = document.getElementById('mainImage');
        const headerText = document.getElementById('headerText');
        const bodyText = document.getElementById('bodyText');

        // Logic to make the 'No' button run away
        function moveButton() {
            const maxWidth = window.innerWidth - noBtn.offsetWidth;
            const maxHeight = window.innerHeight - noBtn.offsetHeight;

            const randomX = Math.floor(Math.random() * maxWidth);
            const randomY = Math.floor(Math.random() * maxHeight);

            noBtn.style.position = 'fixed'; 
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        // logic for 'Yes'
        function acceptApology() {
            mainImage.src = "https://media.tenor.com/gUiu1zyxfzYAAAAi/bear-kiss-bear-kisses.gif"; 
            
            headerText.innerHTML = "Yayyyyy! I Wuvvv You!";
            bodyText.innerHTML = "I promise I'll make it up to you. ❤️";

            document.querySelector('.btn-box').style.display = 'none';
            document.body.style.backgroundImage = "linear-gradient(0deg, #d299c2 0%, #fef9d7 100%)";
        }
    </script>
</body>

</html>
